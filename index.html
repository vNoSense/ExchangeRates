<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>שערי מט"ח</title>

<link rel="manifest" href="data:application/json,{
  %22name%22:%22שערי מט%22,
  %22short_name%22:%22מט%22,
  %22start_url%22:%22.%22,
  %22display%22:%22standalone%22,
  %22background_color%22:%22%230a0a0a%22,
  %22theme_color%22:%22%230a0a0a%22
}">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0f;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.10);
    --text-primary: #f0f0f5;
    --text-secondary: rgba(200,200,210,0.55);
    --text-label: rgba(180,180,195,0.45);
    --accent: #4fc3f7;
    --divider: rgba(255,255,255,0.08);
    --rate-usd: #f0f0f5;
    --rate-eur: #f0f0f5;
    --refresh-bg: rgba(255,255,255,0.07);
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, 'SamsungOne', 'Roboto', sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* Full-screen wallpaper-style gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(30,40,80,0.6) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(10,30,50,0.5) 0%, transparent 60%),
      linear-gradient(160deg, #0d0d18 0%, #090912 100%);
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 32px;
  }

  /* ── Status bar spacer ── */
  .status-bar { height: env(safe-area-inset-top, 28px); }

  /* ── Header ── */
  .header {
    padding: 20px 24px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-label);
  }

  .header-flag {
    font-size: 20px;
    opacity: 0.7;
  }

  /* ── Main card ── */
  .card {
    margin: 12px 20px 0;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 28px 28px 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }

  /* Subtle shimmer on card */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }

  /* ── Rate row ── */
  .rate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }

  .rate-left { display: flex; flex-direction: column; gap: 3px; }

  .currency-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 3px 10px 3px 8px;
    width: fit-content;
  }

  .currency-flag { font-size: 14px; line-height: 1; }

  .currency-code {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: rgba(200,210,230,0.7);
  }

  .currency-name {
    font-size: 11px;
    color: var(--text-label);
    padding-left: 2px;
  }

  .rate-right { text-align: right; }

  .rate-value {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0px;
    line-height: 1;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .rate-value .shekel {
    font-size: 24px;
    font-weight: 400;
    opacity: 1;
    margin-right: 3px;
  }

  .rate-value .decimals {
    font-size: 24px;
    font-weight: 400;
    opacity: 1;
  }

  .rate-change {
    font-size: 11px;
    text-align: right;
    margin-top: 3px;
    height: 14px;
  }

  .change-up   { color: #4caf82; }
  .change-down { color: #e07070; }
  .change-flat { color: var(--text-label); }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--divider);
    margin: 20px 0;
  }

  /* ── Footer row inside card ── */
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }

  .updated-text {
    font-size: 11px;
    color: var(--text-label);
    letter-spacing: 0.02em;
  }

  .updated-text span { color: rgba(200,210,230,0.5); }

  .refresh-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--refresh-bg);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.3s;
    font-size: 15px;
    color: rgba(200,210,230,0.5);
    -webkit-user-select: none;
    user-select: none;
  }

  .refresh-btn:active { background: rgba(255,255,255,0.12); }
  .refresh-btn.spinning { transform: rotate(360deg); transition: transform 0.5s ease; }

  /* ── Secondary info cards ── */
  .info-row {
    display: flex;
    gap: 12px;
    margin: 14px 20px 0;
  }

  .info-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .info-card-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-label);
    margin-bottom: 6px;
  }

  .info-card-value {
    font-size: 18px;
    font-weight: 300;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .info-card-sub {
    font-size: 10px;
    color: var(--text-label);
    margin-top: 2px;
  }

  /* ── Loading state ── */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    display: inline-block;
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Error banner ── */
  .error-banner {
    margin: 12px 20px 0;
    background: rgba(220,80,80,0.12);
    border: 1px solid rgba(220,80,80,0.2);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 12px;
    color: rgba(255,160,160,0.8);
    display: none;
    text-align: center;
  }

  /* ── Bottom note ── */
  .bottom-note {
    margin: 20px 24px 0;
    font-size: 10.5px;
    color: var(--text-label);
    text-align: center;
    line-height: 1.6;
  }

  /* Pulse dot — live indicator */
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4caf82;
    display: inline-block;
    margin-right: 5px;
    vertical-align: middle;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }
</style>
</head>
<body>

<div class="app">
  <div class="status-bar"></div>

  <div class="header">
    <span class="header-title"><span class="live-dot"></span>Exchange Rates</span>
    <span class="header-flag">🇮🇱</span>
  </div>

  <!-- Main rates card -->
  <div class="card">

    <!-- USD row -->
    <div class="rate-row">
      <div class="rate-left">
        <div class="currency-pill">
          <span class="currency-flag">🇺🇸</span>
          <span class="currency-code">USD</span>
        </div>
        <div class="currency-name">US Dollar</div>
      </div>
      <div class="rate-right">
        <div class="rate-value" id="usd-val">
          <span class="shekel">₪</span><span class="skeleton" style="width:60px;height:28px;vertical-align:middle"> </span>
        </div>
        <div class="rate-change" id="usd-change"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- EUR row -->
    <div class="rate-row">
      <div class="rate-left">
        <div class="currency-pill">
          <span class="currency-flag">🇪🇺</span>
          <span class="currency-code">EUR</span>
        </div>
        <div class="currency-name">Euro</div>
      </div>
      <div class="rate-right">
        <div class="rate-value" id="eur-val">
          <span class="shekel">₪</span><span class="skeleton" style="width:60px;height:28px;vertical-align:middle"> </span>
        </div>
        <div class="rate-change" id="eur-change"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="updated-text">Updated <span id="update-time">—</span></div>
      <div class="refresh-btn" id="refresh-btn" onclick="fetchRates(true)">↻</div>
    </div>
  </div>

  <!-- Secondary cards: 100 USD and 100 EUR in ILS -->
  <div class="info-row">
    <div class="info-card">
      <div class="info-card-label">100 USD</div>
      <div class="info-card-value" id="usd-100">₪ —</div>
      <div class="info-card-sub">in Israeli Shekel</div>
    </div>
    <div class="info-card">
      <div class="info-card-label">100 EUR</div>
      <div class="info-card-value" id="eur-100">₪ —</div>
      <div class="info-card-sub">in Israeli Shekel</div>
    </div>
  </div>

  <div class="error-banner" id="error-banner">
    Could not fetch rates. Check your internet connection and tap ↻ to retry.
  </div>

  <div class="bottom-note">
    Rates from open.er-api.com · Updates every 30 min
  </div>
</div>

<script>
  const CACHE_KEY = 'rates_cache';
  const CACHE_TTL = 30 * 60 * 1000; // 30 minutes

  let prevRates = JSON.parse(localStorage.getItem('prev_rates') || 'null');

  function formatRate(val) {
    const str = val.toFixed(4);
    const [int, dec] = str.split('.');
    return { int, dec };
  }

  function setRateUI(elId, changeElId, val, prevVal) {
    const el = document.getElementById(elId);
    const { int, dec } = formatRate(val);
    el.innerHTML = `<span class="shekel">₪</span>${int}<span class="decimals">.${dec}</span>`;

    const chEl = document.getElementById(changeElId);
    if (prevVal) {
      const diff = val - prevVal;
      const pct = ((diff / prevVal) * 100).toFixed(2);
      if (Math.abs(diff) < 0.0001) {
        chEl.innerHTML = `<span class="change-flat">No change</span>`;
      } else if (diff > 0) {
        chEl.innerHTML = `<span class="change-up">▲ ${Math.abs(pct)}%</span>`;
      } else {
        chEl.innerHTML = `<span class="change-down">▼ ${Math.abs(pct)}%</span>`;
      }
    }
  }

  async function fetchRates(manual = false) {
    const btn = document.getElementById('refresh-btn');
    const errBanner = document.getElementById('error-banner');

    // Check cache unless manual refresh
    if (!manual) {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && Date.now() - cached.ts < CACHE_TTL) {
        applyRates(cached.usd, cached.eur);
        return;
      }
    }

    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 500);
    errBanner.style.display = 'none';

    try {
      // Primary: exchangerate-api.com (free, no key needed)
      let usd, eur;
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (!res.ok) throw new Error();
        const data = await res.json();
        usd = data.rates.ILS;
        // Get EUR base separately
        const res2 = await fetch('https://open.er-api.com/v6/latest/EUR');
        if (!res2.ok) throw new Error();
        const data2 = await res2.json();
        eur = data2.rates.ILS;
      } catch {
        // Fallback: frankfurter.dev (ECB rates, no key needed)
        const res = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=ILS');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        usd = data.rates.ILS;
        const res2 = await fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=ILS');
        if (!res2.ok) throw new Error('API error');
        const data2 = await res2.json();
        eur = data2.rates.ILS;
      }

      if (!usd || !eur) throw new Error('Missing rates');


      // Save to cache
      localStorage.setItem(CACHE_KEY, JSON.stringify({ usd, eur, ts: Date.now() }));

      applyRates(usd, eur);

    } catch (e) {
      // Try cache as fallback
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached) {
        applyRates(cached.usd, cached.eur, true);
      } else {
        errBanner.style.display = 'block';
        document.getElementById('usd-val').innerHTML = '<span class="shekel">₪</span> —';
        document.getElementById('eur-val').innerHTML = '<span class="shekel">₪</span> —';
      }
    }
  }

  function applyRates(usd, eur, fromCache = false) {
    setRateUI('usd-val', 'usd-change', usd, prevRates?.usd);
    setRateUI('eur-val', 'eur-change', eur, prevRates?.eur);

    document.getElementById('usd-100').textContent = '₪ ' + (usd * 100).toFixed(1);
    document.getElementById('eur-100').textContent = '₪ ' + (eur * 100).toFixed(1);

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    document.getElementById('update-time').textContent = fromCache ? timeStr + ' (cached)' : timeStr;

    // Save as prev for next load
    localStorage.setItem('prev_rates', JSON.stringify({ usd, eur }));
    prevRates = { usd, eur };
  }

  // Auto-refresh every 30 minutes while page is open
  fetchRates();
  setInterval(() => fetchRates(), CACHE_TTL);

  // Refresh on visibility change (coming back to the app)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fetchRates();
  });
</script>
</body>
</html>
